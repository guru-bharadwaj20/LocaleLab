name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, test and benchmark (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run unit tests
        run: npm test

      - name: Run the synthetic benchmark
        run: node dist/cli.js benchmark --quiet --out benchmark-report

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-node${{ matrix.node }}
          path: benchmark-report
          retention-days: 14
